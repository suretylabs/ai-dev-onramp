name: Materialize on-ramp payload

on:
  push:
    branches:
      - docs/publish-guides-and-templates

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct files
        shell: bash
        run: |
          set -euo pipefail
          cat .onramp-payload/part-* | base64 --decode > /tmp/onramp.tar.gz
          mkdir -p /tmp/onramp
          tar -xzf /tmp/onramp.tar.gz -C /tmp/onramp
          mkdir -p guides .github
          cp /tmp/onramp/guides/*.md guides/
          cp /tmp/onramp/root/README.md README.md
          cp /tmp/onramp/root/CONTRIBUTING.md CONTRIBUTING.md
          cp /tmp/onramp/root/.github/copilot-instructions.md .github/copilot-instructions.md
          rm -rf .onramp-payload
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize generalized guides and root updates [materialized]"
          git push
