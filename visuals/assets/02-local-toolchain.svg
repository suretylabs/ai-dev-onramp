<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1700' viewBox='0 0 1200 1700'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.t6{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#2563eb;text-anchor:start}.t7{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#1f2937;text-anchor:start}.t8{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#0f766e;text-anchor:start}.r3{rx:16;fill:#f5f3ff;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#7c3aed;stroke:none}.r4{rx:16;fill:#f0fdf4;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#15803d;stroke:none}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — Local Toolchain</text><text x='60' y='112' class='t2'>The local workstation becomes trustworthy when its tools can connect to the known GitHub</text><text x='60' y='136.3' class='t2'>repository and prove a complete round trip.</text><text x='60' y='160' class='t3'>1. Local stack</text><rect x='60' y='208' width='344' height='102' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='241' class='t5'>Windows 11</text><rect x='428' y='208' width='344' height='102' class='r2' /><circle cx='458' cy='238' r='18' class='c1' /><text x='458' y='244' class='t4'>2</text><text x='486' y='241' class='t5'>PowerShell 7</text><rect x='796' y='208' width='344' height='102' class='r2' /><circle cx='826' cy='238' r='18' class='c1' /><text x='826' y='244' class='t4'>3</text><text x='854' y='241' class='t5'>Git for Windows</text><rect x='60' y='336' width='344' height='102' class='r2' /><circle cx='90' cy='366' r='18' class='c1' /><text x='90' y='372' class='t4'>4</text><text x='118' y='369' class='t5'>GitHub CLI (gh)</text><rect x='428' y='336' width='344' height='102' class='r2' /><circle cx='458' cy='366' r='18' class='c1' /><text x='458' y='372' class='t4'>5</text><text x='486' y='369' class='t5'>VS Code</text><rect x='796' y='336' width='344' height='102' class='r2' /><circle cx='826' cy='366' r='18' class='c1' /><text x='826' y='372' class='t4'>6</text><text x='854' y='369' class='t5'>uv</text><rect x='60' y='464' width='344' height='102' class='r2' /><circle cx='90' cy='494' r='18' class='c1' /><text x='90' y='500' class='t4'>7</text><text x='118' y='497' class='t5'>Python 3.14</text><line x1='408' y1='259' x2='420' y2='259' class='l1' /><polygon points='420.0,259.0 409.2,264.2 409.2,253.8' class='p1' /><line x1='776' y1='259' x2='788' y2='259' class='l1' /><polygon points='788.0,259.0 777.2,264.2 777.2,253.8' class='p1' /><line x1='408' y1='387' x2='420' y2='387' class='l1' /><polygon points='420.0,387.0 409.2,392.2 409.2,381.8' class='p1' /><line x1='776' y1='387' x2='788' y2='387' class='l1' /><polygon points='788.0,387.0 777.2,392.2 777.2,381.8' class='p1' /><text x='60' y='616' class='t3'>2. Why PowerShell matters</text><rect x='60' y='664' width='1080' height='180' class='r2' /><text x='80' y='698' class='t6'>Inspectable control plane</text><text x='80' y='728' class='t7'>Commands run in PowerShell produce exact output. The developer can return that output to the LLM,</text><text x='80' y='751' class='t7'>which can evaluate the actual machine state instead of guessing what happened in an installer or</text><text x='80' y='773.9' class='t7'>GUI.</text><text x='60' y='894' class='t3'>3. Local versus remote</text><rect x='60' y='942' width='525' height='210' class='r2' /><text x='80' y='976' class='t6'>Local machine</text><text x='80' y='1006' class='t7'>PowerShell</text><text x='80' y='1029' class='t7'>VS Code</text><text x='80' y='1051.9' class='t7'>Local repository</text><text x='80' y='1074.8' class='t7'>Local files and project environment</text><rect x='615' y='942' width='525' height='210' class='r2' /><text x='635' y='976' class='t8'>Remote GitHub</text><text x='635' y='1006' class='t7'>Organization repository</text><text x='635' y='1029' class='t7'>Canonical history</text><text x='635' y='1051.9' class='t7'>Collaboration surface</text><text x='635' y='1074.8' class='t7'>Copilot account context</text><text x='60' y='1197' class='t3'>4. Git round trip</text><rect x='60' y='1245' width='344' height='105' class='r3' /><circle cx='90' cy='1275' r='18' class='c2' /><text x='90' y='1281' class='t4'>1</text><text x='118' y='1278' class='t5'>Edit a file locally</text><rect x='428' y='1245' width='344' height='105' class='r3' /><circle cx='458' cy='1275' r='18' class='c2' /><text x='458' y='1281' class='t4'>2</text><text x='486' y='1278' class='t5'>Inspect with git status</text><rect x='796' y='1245' width='344' height='105' class='r3' /><circle cx='826' cy='1275' r='18' class='c2' /><text x='826' y='1281' class='t4'>3</text><text x='854' y='1278' class='t5'>Stage with git add</text><rect x='60' y='1376' width='344' height='105' class='r3' /><circle cx='90' cy='1406' r='18' class='c2' /><text x='90' y='1412' class='t4'>4</text><text x='118' y='1409' class='t5'>Create a local commit</text><rect x='428' y='1376' width='344' height='105' class='r3' /><circle cx='458' cy='1406' r='18' class='c2' /><text x='458' y='1412' class='t4'>5</text><text x='486' y='1409' class='t5'>Push to GitHub</text><rect x='796' y='1376' width='344' height='105' class='r3' /><circle cx='826' cy='1406' r='18' class='c2' /><text x='826' y='1412' class='t4'>6</text><text x='854' y='1398' class='t5'>Verify the same commit</text><text x='854' y='1422' class='t5'>remotely</text><line x1='408' y1='1297.5' x2='420' y2='1297.5' class='l1' /><polygon points='420.0,1297.5 409.2,1302.7 409.2,1292.3' class='p1' /><line x1='776' y1='1297.5' x2='788' y2='1297.5' class='l1' /><polygon points='788.0,1297.5 777.2,1302.7 777.2,1292.3' class='p1' /><line x1='408' y1='1428.5' x2='420' y2='1428.5' class='l1' /><polygon points='420.0,1428.5 409.2,1433.7 409.2,1423.3' class='p1' /><line x1='776' y1='1428.5' x2='788' y2='1428.5' class='l1' /><polygon points='788.0,1428.5 777.2,1433.7 777.2,1423.3' class='p1' /><text x='60' y='1526' class='t3'>5. Meaning of Git state</text><rect x='60' y='1574' width='252' height='105' class='r4' /><circle cx='90' cy='1604' r='18' class='c3' /><text x='90' y='1610' class='t4'>1</text><text x='118' y='1607' class='t5'>Untracked</text><rect x='336' y='1574' width='252' height='105' class='r4' /><circle cx='366' cy='1604' r='18' class='c3' /><text x='366' y='1610' class='t4'>2</text><text x='394' y='1607' class='t5'>Tracked and staged</text><rect x='612' y='1574' width='252' height='105' class='r4' /><circle cx='642' cy='1604' r='18' class='c3' /><text x='642' y='1610' class='t4'>3</text><text x='670' y='1607' class='t5'>Committed locally</text><rect x='888' y='1574' width='252' height='105' class='r4' /><circle cx='918' cy='1604' r='18' class='c3' /><text x='918' y='1610' class='t4'>4</text><text x='946' y='1607' class='t5'>Pushed remotely</text><line x1='316' y1='1626.5' x2='328' y2='1626.5' class='l1' /><polygon points='328.0,1626.5 317.2,1631.7 317.2,1621.3' class='p1' /><line x1='592' y1='1626.5' x2='604' y2='1626.5' class='l1' /><polygon points='604.0,1626.5 593.2,1631.7 593.2,1621.3' class='p1' /><line x1='868' y1='1626.5' x2='880' y2='1626.5' class='l1' /><polygon points='880.0,1626.5 869.2,1631.7 869.2,1621.3' class='p1' /></svg>