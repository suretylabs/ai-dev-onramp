<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='2050' viewBox='0 0 1200 2050'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.t6{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#2563eb;text-anchor:start}.t7{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#1f2937;text-anchor:start}.t8{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#0f766e;text-anchor:start}.r3{rx:16;fill:#f5f3ff;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#7c3aed;stroke:none}.r4{rx:16;fill:#fffbeb;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#b45309;stroke:none}.t9{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#dc2626;text-anchor:start}.t10{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#15803d;text-anchor:start}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — Gating and State</text><text x='60' y='112' class='t2'>Technical gates prevent false progress. Choice gates keep the developer in control of pace,</text><text x='60' y='136.3' class='t2'>depth, troubleshooting, and pause points.</text><text x='60' y='160' class='t3'>1. Gate model</text><rect x='60' y='208' width='344' height='110' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='241' class='t5'>Do the work</text><rect x='428' y='208' width='344' height='110' class='r2' /><circle cx='458' cy='238' r='18' class='c1' /><text x='458' y='244' class='t4'>2</text><text x='486' y='241' class='t5'>Collect evidence</text><rect x='796' y='208' width='344' height='110' class='r2' /><circle cx='826' cy='238' r='18' class='c1' /><text x='826' y='244' class='t4'>3</text><text x='854' y='241' class='t5'>Evaluate the gate</text><rect x='60' y='344' width='344' height='110' class='r2' /><circle cx='90' cy='374' r='18' class='c1' /><text x='90' y='380' class='t4'>4</text><text x='118' y='366' class='t5'>Record success or the</text><text x='118' y='390' class='t5'>blocker</text><rect x='428' y='344' width='344' height='110' class='r2' /><circle cx='458' cy='374' r='18' class='c1' /><text x='458' y='380' class='t4'>5</text><text x='486' y='377' class='t5'>Offer legitimate next paths</text><rect x='796' y='344' width='344' height='110' class='r2' /><circle cx='826' cy='374' r='18' class='c1' /><text x='826' y='380' class='t4'>6</text><text x='854' y='366' class='t5'>Continue, troubleshoot, or</text><text x='854' y='390' class='t5'>pause</text><line x1='408' y1='263' x2='420' y2='263' class='l1' /><polygon points='420.0,263.0 409.2,268.2 409.2,257.8' class='p1' /><line x1='776' y1='263' x2='788' y2='263' class='l1' /><polygon points='788.0,263.0 777.2,268.2 777.2,257.8' class='p1' /><line x1='408' y1='399' x2='420' y2='399' class='l1' /><polygon points='420.0,399.0 409.2,404.2 409.2,393.8' class='p1' /><line x1='776' y1='399' x2='788' y2='399' class='l1' /><polygon points='788.0,399.0 777.2,404.2 777.2,393.8' class='p1' /><text x='60' y='504' class='t3'>2. Two types of gating</text><rect x='60' y='552' width='525' height='220' class='r2' /><text x='80' y='586' class='t6'>Technical gate</text><text x='80' y='616' class='t7'>Did the thing actually work?</text><text x='80' y='639' class='t7'>Do output, screenshots, files, and observed</text><text x='80' y='661.9' class='t7'>state prove the prerequisite is satisfied?</text><rect x='615' y='552' width='525' height='220' class='r2' /><text x='635' y='586' class='t8'>Choice gate</text><text x='635' y='616' class='t7'>Now that this point is reached, should the</text><text x='635' y='639' class='t7'>developer continue, deepen the current topic,</text><text x='635' y='661.9' class='t7'>troubleshoot, or pause?</text><text x='60' y='822' class='t3'>3. Checkpoint pattern</text><rect x='60' y='870' width='344' height='110' class='r3' /><circle cx='90' cy='900' r='18' class='c2' /><text x='90' y='906' class='t4'>1</text><text x='118' y='903' class='t5'>Summarize verified state</text><rect x='428' y='870' width='344' height='110' class='r3' /><circle cx='458' cy='900' r='18' class='c2' /><text x='458' y='906' class='t4'>2</text><text x='486' y='903' class='t5'>Update BOOTSTRAP_STATE.md</text><rect x='796' y='870' width='344' height='110' class='r3' /><circle cx='826' cy='900' r='18' class='c2' /><text x='826' y='906' class='t4'>3</text><text x='854' y='892' class='t5'>State whether the gate</text><text x='854' y='916' class='t5'>passed</text><rect x='60' y='1006' width='344' height='110' class='r3' /><circle cx='90' cy='1036' r='18' class='c2' /><text x='90' y='1042' class='t4'>4</text><text x='118' y='1039' class='t5'>Present reasonable options</text><rect x='428' y='1006' width='344' height='110' class='r3' /><circle cx='458' cy='1036' r='18' class='c2' /><text x='458' y='1042' class='t4'>5</text><text x='486' y='1028' class='t5'>Recommend a path when</text><text x='486' y='1052' class='t5'>evidence favors one</text><rect x='796' y='1006' width='344' height='110' class='r3' /><circle cx='826' cy='1036' r='18' class='c2' /><text x='826' y='1042' class='t4'>6</text><text x='854' y='1039' class='t5'>Developer chooses</text><line x1='408' y1='925' x2='420' y2='925' class='l1' /><polygon points='420.0,925.0 409.2,930.2 409.2,919.8' class='p1' /><line x1='776' y1='925' x2='788' y2='925' class='l1' /><polygon points='788.0,925.0 777.2,930.2 777.2,919.8' class='p1' /><line x1='408' y1='1061' x2='420' y2='1061' class='l1' /><polygon points='420.0,1061.0 409.2,1066.2 409.2,1055.8' class='p1' /><line x1='776' y1='1061' x2='788' y2='1061' class='l1' /><polygon points='788.0,1061.0 777.2,1066.2 777.2,1055.8' class='p1' /><text x='60' y='1166' class='t3'>4. What the running state document contains</text><rect x='60' y='1214' width='528' height='100' class='r4' /><circle cx='90' cy='1244' r='18' class='c3' /><text x='90' y='1250' class='t4'>1</text><text x='118' y='1247' class='t5'>Current phase</text><rect x='612' y='1214' width='528' height='100' class='r4' /><circle cx='642' cy='1244' r='18' class='c3' /><text x='642' y='1250' class='t4'>2</text><text x='670' y='1247' class='t5'>Completed gates and evidence</text><rect x='60' y='1340' width='528' height='100' class='r4' /><circle cx='90' cy='1370' r='18' class='c3' /><text x='90' y='1376' class='t4'>3</text><text x='118' y='1373' class='t5'>Machine and tool state</text><rect x='612' y='1340' width='528' height='100' class='r4' /><circle cx='642' cy='1370' r='18' class='c3' /><text x='642' y='1376' class='t4'>4</text><text x='670' y='1373' class='t5'>Open decisions and deferred work</text><rect x='60' y='1466' width='528' height='100' class='r4' /><circle cx='90' cy='1496' r='18' class='c3' /><text x='90' y='1502' class='t4'>5</text><text x='118' y='1499' class='t5'>Blockers and evidence needed</text><rect x='612' y='1466' width='528' height='100' class='r4' /><circle cx='642' cy='1496' r='18' class='c3' /><text x='642' y='1502' class='t4'>6</text><text x='670' y='1499' class='t5'>Last successful command or GUI state</text><rect x='60' y='1592' width='528' height='100' class='r4' /><circle cx='90' cy='1622' r='18' class='c3' /><text x='90' y='1628' class='t4'>7</text><text x='118' y='1625' class='t5'>Selected path and resume point</text><rect x='612' y='1592' width='528' height='100' class='r4' /><circle cx='642' cy='1622' r='18' class='c3' /><text x='642' y='1628' class='t4'>8</text><text x='670' y='1625' class='t5'>Next recommended action</text><line x1='592' y1='1264' x2='604' y2='1264' class='l1' /><polygon points='604.0,1264.0 593.2,1269.2 593.2,1258.8' class='p1' /><line x1='592' y1='1390' x2='604' y2='1390' class='l1' /><polygon points='604.0,1390.0 593.2,1395.2 593.2,1384.8' class='p1' /><line x1='592' y1='1516' x2='604' y2='1516' class='l1' /><polygon points='604.0,1516.0 593.2,1521.2 593.2,1510.8' class='p1' /><line x1='592' y1='1642' x2='604' y2='1642' class='l1' /><polygon points='604.0,1642.0 593.2,1647.2 593.2,1636.8' class='p1' /><text x='60' y='1742' class='t3'>5. Pause and resume</text><rect x='60' y='1790' width='525' height='195' class='r2' /><text x='80' y='1824' class='t9'>Without durable state</text><text x='80' y='1854' class='t7'>Every new AI session must reconstruct reality</text><text x='80' y='1877' class='t7'>and may repeat work or invent assumptions.</text><rect x='615' y='1790' width='525' height='195' class='r2' /><text x='635' y='1824' class='t10'>With durable state</text><text x='635' y='1854' class='t7'>The AI resumes from verified facts, and the</text><text x='635' y='1877' class='t7'>developer can stop and restart without losing</text><text x='635' y='1899.9' class='t7'>the exact operating context.</text></svg>