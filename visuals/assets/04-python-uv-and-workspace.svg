<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1900' viewBox='0 0 1200 1900'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.r3{rx:16;fill:#f5f3ff;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#7c3aed;stroke:none}.r4{rx:16;fill:#fffbeb;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#b45309;stroke:none}.r5{rx:16;fill:#ecfeff;stroke:#cbd5e1;stroke-width:1.5}.c4{fill:#0f766e;stroke:none}.r6{rx:16;fill:#f0fdf4;stroke:#cbd5e1;stroke-width:1.5}.c5{fill:#15803d;stroke:none}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — Python, uv, and the Workspace</text><text x='60' y='112' class='t2'>The modern Python project separates the interpreter, the isolated environment, declared</text><text x='60' y='136.3' class='t2'>dependencies, locked versions, and application code.</text><text x='60' y='160' class='t3'>1. Python project stack</text><rect x='60' y='208' width='252' height='110' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='230' class='t5'>Python 3.14</text><text x='118' y='254' class='t5'>interpreter</text><rect x='336' y='208' width='252' height='110' class='r2' /><circle cx='366' cy='238' r='18' class='c1' /><text x='366' y='244' class='t4'>2</text><text x='394' y='219' class='t5'>Project</text><text x='394' y='243' class='t5'>environment</text><text x='394' y='267' class='t5'>(.venv)</text><rect x='612' y='208' width='252' height='110' class='r2' /><circle cx='642' cy='238' r='18' class='c1' /><text x='642' y='244' class='t4'>3</text><text x='670' y='230' class='t5'>Installed</text><text x='670' y='254' class='t5'>dependencies</text><rect x='888' y='208' width='252' height='110' class='r2' /><circle cx='918' cy='238' r='18' class='c1' /><text x='918' y='244' class='t4'>4</text><text x='946' y='241' class='t5'>Application code</text><line x1='316' y1='263' x2='328' y2='263' class='l1' /><polygon points='328.0,263.0 317.2,268.2 317.2,257.8' class='p1' /><line x1='592' y1='263' x2='604' y2='263' class='l1' /><polygon points='604.0,263.0 593.2,268.2 593.2,257.8' class='p1' /><line x1='868' y1='263' x2='880' y2='263' class='l1' /><polygon points='880.0,263.0 869.2,268.2 869.2,257.8' class='p1' /><text x='60' y='368' class='t3'>2. uv is the control plane</text><rect x='60' y='416' width='344' height='105' class='r3' /><circle cx='90' cy='446' r='18' class='c2' /><text x='90' y='452' class='t4'>1</text><text x='118' y='449' class='t5'>Install Python</text><rect x='428' y='416' width='344' height='105' class='r3' /><circle cx='458' cy='446' r='18' class='c2' /><text x='458' y='452' class='t4'>2</text><text x='486' y='438' class='t5'>Create the project</text><text x='486' y='462' class='t5'>environment</text><rect x='796' y='416' width='344' height='105' class='r3' /><circle cx='826' cy='446' r='18' class='c2' /><text x='826' y='452' class='t4'>3</text><text x='854' y='438' class='t5'>Declare and install</text><text x='854' y='462' class='t5'>dependencies</text><rect x='60' y='547' width='344' height='105' class='r3' /><circle cx='90' cy='577' r='18' class='c2' /><text x='90' y='583' class='t4'>4</text><text x='118' y='580' class='t5'>Lock exact versions</text><rect x='428' y='547' width='344' height='105' class='r3' /><circle cx='458' cy='577' r='18' class='c2' /><text x='458' y='583' class='t4'>5</text><text x='486' y='569' class='t5'>Run commands in project</text><text x='486' y='593' class='t5'>context</text><line x1='408' y1='468.5' x2='420' y2='468.5' class='l1' /><polygon points='420.0,468.5 409.2,473.7 409.2,463.3' class='p1' /><line x1='776' y1='468.5' x2='788' y2='468.5' class='l1' /><polygon points='788.0,468.5 777.2,473.7 777.2,463.3' class='p1' /><line x1='408' y1='599.5' x2='420' y2='599.5' class='l1' /><polygon points='420.0,599.5 409.2,604.7 409.2,594.3' class='p1' /><text x='60' y='702' class='t3'>3. Dependency state</text><rect x='60' y='750' width='528' height='115' class='r4' /><circle cx='90' cy='780' r='18' class='c3' /><text x='90' y='786' class='t4'>1</text><text x='118' y='783' class='t5'>pyproject.toml declares project intent</text><rect x='612' y='750' width='528' height='115' class='r4' /><circle cx='642' cy='780' r='18' class='c3' /><text x='642' y='786' class='t4'>2</text><text x='670' y='783' class='t5'>uv sync resolves and installs</text><rect x='60' y='891' width='528' height='115' class='r4' /><circle cx='90' cy='921' r='18' class='c3' /><text x='90' y='927' class='t4'>3</text><text x='118' y='924' class='t5'>.venv holds the isolated environment</text><rect x='612' y='891' width='528' height='115' class='r4' /><circle cx='642' cy='921' r='18' class='c3' /><text x='642' y='927' class='t4'>4</text><text x='670' y='924' class='t5'>uv.lock records exact resolved versions</text><line x1='592' y1='807.5' x2='604' y2='807.5' class='l1' /><polygon points='604.0,807.5 593.2,812.7 593.2,802.3' class='p1' /><line x1='592' y1='948.5' x2='604' y2='948.5' class='l1' /><polygon points='604.0,948.5 593.2,953.7 593.2,943.3' class='p1' /><text x='60' y='1056' class='t3'>4. Data-stack mental model</text><rect x='60' y='1104' width='344' height='112' class='r5' /><circle cx='90' cy='1134' r='18' class='c4' /><text x='90' y='1140' class='t4'>1</text><text x='118' y='1126' class='t5'>MSSQL, PDFs, and source</text><text x='118' y='1150' class='t5'>files</text><rect x='428' y='1104' width='344' height='112' class='r5' /><circle cx='458' cy='1134' r='18' class='c4' /><text x='458' y='1140' class='t4'>2</text><text x='486' y='1137' class='t5'>Python orchestration</text><rect x='796' y='1104' width='344' height='112' class='r5' /><circle cx='826' cy='1134' r='18' class='c4' /><text x='826' y='1140' class='t4'>3</text><text x='854' y='1137' class='t5'>Polars transforms data</text><rect x='60' y='1242' width='344' height='112' class='r5' /><circle cx='90' cy='1272' r='18' class='c4' /><text x='90' y='1278' class='t4'>4</text><text x='118' y='1264' class='t5'>Parquet stores analytical</text><text x='118' y='1288' class='t5'>data</text><rect x='428' y='1242' width='344' height='112' class='r5' /><circle cx='458' cy='1272' r='18' class='c4' /><text x='458' y='1278' class='t4'>5</text><text x='486' y='1275' class='t5'>DuckDB queries with SQL</text><rect x='796' y='1242' width='344' height='112' class='r5' /><circle cx='826' cy='1272' r='18' class='c4' /><text x='826' y='1278' class='t4'>6</text><text x='854' y='1264' class='t5'>Validation, reporting, and</text><text x='854' y='1288' class='t5'>exports</text><line x1='408' y1='1160' x2='420' y2='1160' class='l1' /><polygon points='420.0,1160.0 409.2,1165.2 409.2,1154.8' class='p1' /><line x1='776' y1='1160' x2='788' y2='1160' class='l1' /><polygon points='788.0,1160.0 777.2,1165.2 777.2,1154.8' class='p1' /><line x1='408' y1='1298' x2='420' y2='1298' class='l1' /><polygon points='420.0,1298.0 409.2,1303.2 409.2,1292.8' class='p1' /><line x1='776' y1='1298' x2='788' y2='1298' class='l1' /><polygon points='788.0,1298.0 777.2,1303.2 777.2,1292.8' class='p1' /><text x='60' y='1404' class='t3'>5. First integrated proof</text><rect x='60' y='1452' width='344' height='110' class='r6' /><circle cx='90' cy='1482' r='18' class='c5' /><text x='90' y='1488' class='t4'>1</text><text x='118' y='1474' class='t5'>Create a small</text><text x='118' y='1498' class='t5'>representative input</text><rect x='428' y='1452' width='344' height='110' class='r6' /><circle cx='458' cy='1482' r='18' class='c5' /><text x='458' y='1488' class='t4'>2</text><text x='486' y='1474' class='t5'>Load and transform with</text><text x='486' y='1498' class='t5'>Polars</text><rect x='796' y='1452' width='344' height='110' class='r6' /><circle cx='826' cy='1482' r='18' class='c5' /><text x='826' y='1488' class='t4'>3</text><text x='854' y='1485' class='t5'>Write Parquet</text><rect x='60' y='1588' width='344' height='110' class='r6' /><circle cx='90' cy='1618' r='18' class='c5' /><text x='90' y='1624' class='t4'>4</text><text x='118' y='1621' class='t5'>Query with DuckDB</text><rect x='428' y='1588' width='344' height='110' class='r6' /><circle cx='458' cy='1618' r='18' class='c5' /><text x='458' y='1624' class='t4'>5</text><text x='486' y='1610' class='t5'>Validate the expected</text><text x='486' y='1634' class='t5'>output</text><rect x='796' y='1588' width='344' height='110' class='r6' /><circle cx='826' cy='1618' r='18' class='c5' /><text x='826' y='1624' class='t4'>6</text><text x='854' y='1610' class='t5'>Run Ruff, Pyright, and</text><text x='854' y='1634' class='t5'>pytest</text><line x1='408' y1='1507' x2='420' y2='1507' class='l1' /><polygon points='420.0,1507.0 409.2,1512.2 409.2,1501.8' class='p1' /><line x1='776' y1='1507' x2='788' y2='1507' class='l1' /><polygon points='788.0,1507.0 777.2,1512.2 777.2,1501.8' class='p1' /><line x1='408' y1='1643' x2='420' y2='1643' class='l1' /><polygon points='420.0,1643.0 409.2,1648.2 409.2,1637.8' class='p1' /><line x1='776' y1='1643' x2='788' y2='1643' class='l1' /><polygon points='788.0,1643.0 777.2,1648.2 777.2,1637.8' class='p1' /></svg>