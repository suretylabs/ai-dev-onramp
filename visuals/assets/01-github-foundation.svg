<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1800' viewBox='0 0 1200 1800'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.t4{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#2563eb;text-anchor:start}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#1f2937;text-anchor:start}.t6{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#0f766e;text-anchor:start}.r3{rx:16;fill:#f5f3ff;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#7c3aed;stroke:none}.t7{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t8{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.t9{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#64748b;text-anchor:start}.r4{rx:16;fill:#f0fdf4;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#15803d;stroke:none}.c3{fill:#2563eb;stroke:none}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — GitHub Foundation</text><text x='60' y='112' class='t2'>GitHub establishes identity, business ownership, a known remote, and the account context used</text><text x='60' y='136.3' class='t2'>by local tools and Copilot.</text><text x='60' y='160' class='t3'>1. Identity and ownership</text><rect x='60' y='208' width='525' height='235' class='r2' /><text x='80' y='242' class='t4'>Personal GitHub account</text><text x='80' y='272' class='t5'>Authenticates the human developer. Holds</text><text x='80' y='294.9' class='t5'>verified email, recovery methods, 2FA or</text><text x='80' y='317.9' class='t5'>passkeys, and the sign-in used by gh, VS Code,</text><text x='80' y='340.9' class='t5'>and Copilot.</text><rect x='615' y='208' width='525' height='235' class='r2' /><text x='635' y='242' class='t6'>Business GitHub organization</text><text x='635' y='272' class='t5'>Owns repositories, controls access, and</text><text x='635' y='294.9' class='t5'>becomes the durable home for collaboration,</text><text x='635' y='317.9' class='t5'>future automation, and organization-managed</text><text x='635' y='340.9' class='t5'>Copilot policy.</text><text x='60' y='488' class='t3'>2. GitHub-first sequence</text><rect x='60' y='536' width='344' height='105' class='r3' /><circle cx='90' cy='566' r='18' class='c1' /><text x='90' y='572' class='t7'>1</text><text x='118' y='569' class='t8'>Create account</text><rect x='428' y='536' width='344' height='105' class='r3' /><circle cx='458' cy='566' r='18' class='c1' /><text x='458' y='572' class='t7'>2</text><text x='486' y='569' class='t8'>Secure account</text><rect x='796' y='536' width='344' height='105' class='r3' /><circle cx='826' cy='566' r='18' class='c1' /><text x='826' y='572' class='t7'>3</text><text x='854' y='569' class='t8'>Create organization</text><rect x='60' y='667' width='344' height='105' class='r3' /><circle cx='90' cy='697' r='18' class='c1' /><text x='90' y='703' class='t7'>4</text><text x='118' y='700' class='t8'>Create private repository</text><rect x='428' y='667' width='344' height='105' class='r3' /><circle cx='458' cy='697' r='18' class='c1' /><text x='458' y='703' class='t7'>5</text><text x='486' y='700' class='t8'>Install local tools</text><rect x='796' y='667' width='344' height='105' class='r3' /><circle cx='826' cy='697' r='18' class='c1' /><text x='826' y='703' class='t7'>6</text><text x='854' y='700' class='t8'>Clone the known remote</text><line x1='408' y1='588.5' x2='420' y2='588.5' class='l1' /><polygon points='420.0,588.5 409.2,593.7 409.2,583.3' class='p1' /><line x1='776' y1='588.5' x2='788' y2='588.5' class='l1' /><polygon points='788.0,588.5 777.2,593.7 777.2,583.3' class='p1' /><line x1='408' y1='719.5' x2='420' y2='719.5' class='l1' /><polygon points='420.0,719.5 409.2,724.7 409.2,714.3' class='p1' /><line x1='776' y1='719.5' x2='788' y2='719.5' class='l1' /><polygon points='788.0,719.5 777.2,724.7 777.2,714.3' class='p1' /><text x='60' y='822' class='t3'>3. Lightweight repository protections</text><text x='60' y='854' class='t9'>Enough discipline to prevent obvious damage without inventing enterprise process for a one-person</text><text x='60' y='877' class='t9'>project.</text><rect x='60' y='897' width='528' height='98' class='r4' /><circle cx='90' cy='927' r='18' class='c2' /><text x='90' y='933' class='t7'>1</text><text x='118' y='930' class='t8'>Private repository by default</text><rect x='612' y='897' width='528' height='98' class='r4' /><circle cx='642' cy='927' r='18' class='c2' /><text x='642' y='933' class='t7'>2</text><text x='670' y='930' class='t8'>main is the default branch</text><rect x='60' y='1021' width='528' height='98' class='r4' /><circle cx='90' cy='1051' r='18' class='c2' /><text x='90' y='1057' class='t7'>3</text><text x='118' y='1054' class='t8'>No force-pushing main</text><rect x='612' y='1021' width='528' height='98' class='r4' /><circle cx='642' cy='1051' r='18' class='c2' /><text x='642' y='1057' class='t7'>4</text><text x='670' y='1054' class='t8'>No deleting main</text><rect x='60' y='1145' width='528' height='98' class='r4' /><circle cx='90' cy='1175' r='18' class='c2' /><text x='90' y='1181' class='t7'>5</text><text x='118' y='1178' class='t8'>Small reversible commits</text><rect x='612' y='1145' width='528' height='98' class='r4' /><circle cx='642' cy='1175' r='18' class='c2' /><text x='642' y='1181' class='t7'>6</text><text x='670' y='1178' class='t8'>Review diffs before merge when practical</text><rect x='60' y='1269' width='528' height='98' class='r4' /><circle cx='90' cy='1299' r='18' class='c2' /><text x='90' y='1305' class='t7'>7</text><text x='118' y='1302' class='t8'>Never commit secrets or production data</text><rect x='612' y='1269' width='528' height='98' class='r4' /><circle cx='642' cy='1299' r='18' class='c2' /><text x='642' y='1305' class='t7'>8</text><text x='670' y='1291' class='t8'>Add heavier controls only when risk requires</text><text x='670' y='1315' class='t8'>them</text><line x1='592' y1='946' x2='604' y2='946' class='l1' /><polygon points='604.0,946.0 593.2,951.2 593.2,940.8' class='p1' /><line x1='592' y1='1070' x2='604' y2='1070' class='l1' /><polygon points='604.0,1070.0 593.2,1075.2 593.2,1064.8' class='p1' /><line x1='592' y1='1194' x2='604' y2='1194' class='l1' /><polygon points='604.0,1194.0 593.2,1199.2 593.2,1188.8' class='p1' /><line x1='592' y1='1318' x2='604' y2='1318' class='l1' /><polygon points='604.0,1318.0 593.2,1323.2 593.2,1312.8' class='p1' /><text x='60' y='1417' class='t3'>4. GitHub is more than remote backup</text><rect x='60' y='1465' width='344' height='100' class='r2' /><circle cx='90' cy='1495' r='18' class='c3' /><text x='90' y='1501' class='t7'>1</text><text x='118' y='1498' class='t8'>Identity</text><rect x='428' y='1465' width='344' height='100' class='r2' /><circle cx='458' cy='1495' r='18' class='c3' /><text x='458' y='1501' class='t7'>2</text><text x='486' y='1498' class='t8'>Organization ownership</text><rect x='796' y='1465' width='344' height='100' class='r2' /><circle cx='826' cy='1495' r='18' class='c3' /><text x='826' y='1501' class='t7'>3</text><text x='854' y='1498' class='t8'>Collaboration</text><rect x='60' y='1591' width='344' height='100' class='r2' /><circle cx='90' cy='1621' r='18' class='c3' /><text x='90' y='1627' class='t7'>4</text><text x='118' y='1624' class='t8'>Copilot account context</text><rect x='428' y='1591' width='344' height='100' class='r2' /><circle cx='458' cy='1621' r='18' class='c3' /><text x='458' y='1627' class='t7'>5</text><text x='486' y='1624' class='t8'>Remote source of truth</text><rect x='796' y='1591' width='344' height='100' class='r2' /><circle cx='826' cy='1621' r='18' class='c3' /><text x='826' y='1627' class='t7'>6</text><text x='854' y='1613' class='t8'>Future automation and</text><text x='854' y='1637' class='t8'>policy</text><line x1='408' y1='1515' x2='420' y2='1515' class='l1' /><polygon points='420.0,1515.0 409.2,1520.2 409.2,1509.8' class='p1' /><line x1='776' y1='1515' x2='788' y2='1515' class='l1' /><polygon points='788.0,1515.0 777.2,1520.2 777.2,1509.8' class='p1' /><line x1='408' y1='1641' x2='420' y2='1641' class='l1' /><polygon points='420.0,1641.0 409.2,1646.2 409.2,1635.8' class='p1' /><line x1='776' y1='1641' x2='788' y2='1641' class='l1' /><polygon points='788.0,1641.0 777.2,1646.2 777.2,1635.8' class='p1' /></svg>