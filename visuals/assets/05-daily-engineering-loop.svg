<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1800' viewBox='0 0 1200 1800'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.r3{rx:16;fill:#ecfeff;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#0f766e;stroke:none}.r4{rx:16;fill:#fffbeb;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#b45309;stroke:none}.r5{rx:16;fill:#f0fdf4;stroke:#cbd5e1;stroke-width:1.5}.c4{fill:#15803d;stroke:none}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — Daily Engineering Loop</text><text x='60' y='112' class='t2'>Once the platform exists, the daily loop keeps context, code, validation, Git history, and</text><text x='60' y='136.3' class='t2'>remote state aligned.</text><text x='60' y='160' class='t3'>1. Standard daily loop</text><rect x='60' y='208' width='344' height='103' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='241' class='t5'>Open the repository</text><rect x='428' y='208' width='344' height='103' class='r2' /><circle cx='458' cy='238' r='18' class='c1' /><text x='458' y='244' class='t4'>2</text><text x='486' y='241' class='t5'>Read current state</text><rect x='796' y='208' width='344' height='103' class='r2' /><circle cx='826' cy='238' r='18' class='c1' /><text x='826' y='244' class='t4'>3</text><text x='854' y='241' class='t5'>Sync the environment</text><rect x='60' y='337' width='344' height='103' class='r2' /><circle cx='90' cy='367' r='18' class='c1' /><text x='90' y='373' class='t4'>4</text><text x='118' y='370' class='t5'>Clarify today’s objective</text><rect x='428' y='337' width='344' height='103' class='r2' /><circle cx='458' cy='367' r='18' class='c1' /><text x='458' y='373' class='t4'>5</text><text x='486' y='370' class='t5'>Make focused changes</text><rect x='796' y='337' width='344' height='103' class='r2' /><circle cx='826' cy='367' r='18' class='c1' /><text x='826' y='373' class='t4'>6</text><text x='854' y='370' class='t5'>Run validation</text><rect x='60' y='466' width='344' height='103' class='r2' /><circle cx='90' cy='496' r='18' class='c1' /><text x='90' y='502' class='t4'>7</text><text x='118' y='499' class='t5'>Review the diff</text><rect x='428' y='466' width='344' height='103' class='r2' /><circle cx='458' cy='496' r='18' class='c1' /><text x='458' y='502' class='t4'>8</text><text x='486' y='499' class='t5'>Commit</text><rect x='796' y='466' width='344' height='103' class='r2' /><circle cx='826' cy='496' r='18' class='c1' /><text x='826' y='502' class='t4'>9</text><text x='854' y='499' class='t5'>Push</text><rect x='60' y='595' width='344' height='103' class='r2' /><circle cx='90' cy='625' r='18' class='c1' /><text x='90' y='631' class='t4'>10</text><text x='118' y='617' class='t5'>Update brief or state if</text><text x='118' y='641' class='t5'>needed</text><line x1='408' y1='259.5' x2='420' y2='259.5' class='l1' /><polygon points='420.0,259.5 409.2,264.7 409.2,254.3' class='p1' /><line x1='776' y1='259.5' x2='788' y2='259.5' class='l1' /><polygon points='788.0,259.5 777.2,264.7 777.2,254.3' class='p1' /><line x1='408' y1='388.5' x2='420' y2='388.5' class='l1' /><polygon points='420.0,388.5 409.2,393.7 409.2,383.3' class='p1' /><line x1='776' y1='388.5' x2='788' y2='388.5' class='l1' /><polygon points='788.0,388.5 777.2,393.7 777.2,383.3' class='p1' /><line x1='408' y1='517.5' x2='420' y2='517.5' class='l1' /><polygon points='420.0,517.5 409.2,522.7 409.2,512.3' class='p1' /><line x1='776' y1='517.5' x2='788' y2='517.5' class='l1' /><polygon points='788.0,517.5 777.2,522.7 777.2,512.3' class='p1' /><text x='60' y='748' class='t3'>2. Micro-loop while working with AI</text><rect x='60' y='796' width='344' height='105' class='r3' /><circle cx='90' cy='826' r='18' class='c2' /><text x='90' y='832' class='t4'>1</text><text x='118' y='829' class='t5'>Describe the change</text><rect x='428' y='796' width='344' height='105' class='r3' /><circle cx='458' cy='826' r='18' class='c2' /><text x='458' y='832' class='t4'>2</text><text x='486' y='829' class='t5'>AI suggests the next step</text><rect x='796' y='796' width='344' height='105' class='r3' /><circle cx='826' cy='826' r='18' class='c2' /><text x='826' y='832' class='t4'>3</text><text x='854' y='829' class='t5'>Developer executes or edits</text><rect x='60' y='927' width='344' height='105' class='r3' /><circle cx='90' cy='957' r='18' class='c2' /><text x='90' y='963' class='t4'>4</text><text x='118' y='960' class='t5'>Observe the actual result</text><rect x='428' y='927' width='344' height='105' class='r3' /><circle cx='458' cy='957' r='18' class='c2' /><text x='458' y='963' class='t4'>5</text><text x='486' y='960' class='t5'>AI interprets the evidence</text><rect x='796' y='927' width='344' height='105' class='r3' /><circle cx='826' cy='957' r='18' class='c2' /><text x='826' y='963' class='t4'>6</text><text x='854' y='960' class='t5'>Choose the next step</text><line x1='408' y1='848.5' x2='420' y2='848.5' class='l1' /><polygon points='420.0,848.5 409.2,853.7 409.2,843.3' class='p1' /><line x1='776' y1='848.5' x2='788' y2='848.5' class='l1' /><polygon points='788.0,848.5 777.2,853.7 777.2,843.3' class='p1' /><line x1='408' y1='979.5' x2='420' y2='979.5' class='l1' /><polygon points='420.0,979.5 409.2,984.7 409.2,974.3' class='p1' /><line x1='776' y1='979.5' x2='788' y2='979.5' class='l1' /><polygon points='788.0,979.5 777.2,984.7 777.2,974.3' class='p1' /><text x='60' y='1082' class='t3'>3. Validation loop</text><rect x='60' y='1130' width='344' height='105' class='r4' /><circle cx='90' cy='1160' r='18' class='c3' /><text x='90' y='1166' class='t4'>1</text><text x='118' y='1163' class='t5'>Code changes</text><rect x='428' y='1130' width='344' height='105' class='r4' /><circle cx='458' cy='1160' r='18' class='c3' /><text x='458' y='1166' class='t4'>2</text><text x='486' y='1163' class='t5'>Run formatting and lint</text><rect x='796' y='1130' width='344' height='105' class='r4' /><circle cx='826' cy='1160' r='18' class='c3' /><text x='826' y='1166' class='t4'>3</text><text x='854' y='1163' class='t5'>Run type checks</text><rect x='60' y='1261' width='344' height='105' class='r4' /><circle cx='90' cy='1291' r='18' class='c3' /><text x='90' y='1297' class='t4'>4</text><text x='118' y='1294' class='t5'>Run tests</text><rect x='428' y='1261' width='344' height='105' class='r4' /><circle cx='458' cy='1291' r='18' class='c3' /><text x='458' y='1297' class='t4'>5</text><text x='486' y='1283' class='t5'>If a check fails, fix and</text><text x='486' y='1307' class='t5'>rerun</text><rect x='796' y='1261' width='344' height='105' class='r4' /><circle cx='826' cy='1291' r='18' class='c3' /><text x='826' y='1297' class='t4'>6</text><text x='854' y='1294' class='t5'>When all pass, commit</text><line x1='408' y1='1182.5' x2='420' y2='1182.5' class='l1' /><polygon points='420.0,1182.5 409.2,1187.7 409.2,1177.3' class='p1' /><line x1='776' y1='1182.5' x2='788' y2='1182.5' class='l1' /><polygon points='788.0,1182.5 777.2,1187.7 777.2,1177.3' class='p1' /><line x1='408' y1='1313.5' x2='420' y2='1313.5' class='l1' /><polygon points='420.0,1313.5 409.2,1318.7 409.2,1308.3' class='p1' /><line x1='776' y1='1313.5' x2='788' y2='1313.5' class='l1' /><polygon points='788.0,1313.5 777.2,1318.7 777.2,1308.3' class='p1' /><text x='60' y='1416' class='t3'>4. Progress model</text><rect x='60' y='1464' width='344' height='105' class='r5' /><circle cx='90' cy='1494' r='18' class='c4' /><text x='90' y='1500' class='t4'>1</text><text x='118' y='1497' class='t5'>Thinking</text><rect x='428' y='1464' width='344' height='105' class='r5' /><circle cx='458' cy='1494' r='18' class='c4' /><text x='458' y='1500' class='t4'>2</text><text x='486' y='1497' class='t5'>Documented plan</text><rect x='796' y='1464' width='344' height='105' class='r5' /><circle cx='826' cy='1494' r='18' class='c4' /><text x='826' y='1500' class='t4'>3</text><text x='854' y='1497' class='t5'>Working code</text><rect x='60' y='1595' width='344' height='105' class='r5' /><circle cx='90' cy='1625' r='18' class='c4' /><text x='90' y='1631' class='t4'>4</text><text x='118' y='1628' class='t5'>Verified code</text><rect x='428' y='1595' width='344' height='105' class='r5' /><circle cx='458' cy='1625' r='18' class='c4' /><text x='458' y='1631' class='t4'>5</text><text x='486' y='1628' class='t5'>Committed history</text><rect x='796' y='1595' width='344' height='105' class='r5' /><circle cx='826' cy='1625' r='18' class='c4' /><text x='826' y='1631' class='t4'>6</text><text x='854' y='1628' class='t5'>Shared remote state</text><line x1='408' y1='1516.5' x2='420' y2='1516.5' class='l1' /><polygon points='420.0,1516.5 409.2,1521.7 409.2,1511.3' class='p1' /><line x1='776' y1='1516.5' x2='788' y2='1516.5' class='l1' /><polygon points='788.0,1516.5 777.2,1521.7 777.2,1511.3' class='p1' /><line x1='408' y1='1647.5' x2='420' y2='1647.5' class='l1' /><polygon points='420.0,1647.5 409.2,1652.7 409.2,1642.3' class='p1' /><line x1='776' y1='1647.5' x2='788' y2='1647.5' class='l1' /><polygon points='788.0,1647.5 777.2,1652.7 777.2,1642.3' class='p1' /></svg>