<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='2200' viewBox='0 0 1200 2200'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.t6{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#64748b;text-anchor:start}.t7{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#2563eb;text-anchor:start}.t8{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#1f2937;text-anchor:start}.t9{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#0f766e;text-anchor:start}.r3{rx:16;fill:#fffbeb;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#b45309;stroke:none}.r4{rx:16;fill:#ecfeff;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#0f766e;stroke:none}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — Visual Meta Flow</text><text x='60' y='112' class='t2'>A single mental model for the complete transition from a clean Windows machine to a durable</text><text x='60' y='136.3' class='t2'>AI-assisted development workflow.</text><text x='60' y='160' class='t3'>1. Overall journey</text><rect x='60' y='208' width='344' height='110' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='241' class='t5'>Clean Windows 11 machine</text><rect x='428' y='208' width='344' height='110' class='r2' /><circle cx='458' cy='238' r='18' class='c1' /><text x='458' y='244' class='t4'>2</text><text x='486' y='230' class='t5'>Create personal GitHub</text><text x='486' y='254' class='t5'>identity</text><rect x='796' y='208' width='344' height='110' class='r2' /><circle cx='826' cy='238' r='18' class='c1' /><text x='826' y='244' class='t4'>3</text><text x='854' y='230' class='t5'>Create business GitHub</text><text x='854' y='254' class='t5'>organization</text><rect x='60' y='344' width='344' height='110' class='r2' /><circle cx='90' cy='374' r='18' class='c1' /><text x='90' y='380' class='t4'>4</text><text x='118' y='366' class='t5'>Create organization-owned</text><text x='118' y='390' class='t5'>repository</text><rect x='428' y='344' width='344' height='110' class='r2' /><circle cx='458' cy='374' r='18' class='c1' /><text x='458' y='380' class='t4'>5</text><text x='486' y='377' class='t5'>Install Git and GitHub CLI</text><rect x='796' y='344' width='344' height='110' class='r2' /><circle cx='826' cy='374' r='18' class='c1' /><text x='826' y='380' class='t4'>6</text><text x='854' y='377' class='t5'>Clone repository locally</text><rect x='60' y='480' width='344' height='110' class='r2' /><circle cx='90' cy='510' r='18' class='c1' /><text x='90' y='516' class='t4'>7</text><text x='118' y='513' class='t5'>Open repository in VS Code</text><rect x='428' y='480' width='344' height='110' class='r2' /><circle cx='458' cy='510' r='18' class='c1' /><text x='458' y='516' class='t4'>8</text><text x='486' y='502' class='t5'>Enable Copilot and AI</text><text x='486' y='526' class='t5'>assistance</text><rect x='796' y='480' width='344' height='110' class='r2' /><circle cx='826' cy='510' r='18' class='c1' /><text x='826' y='516' class='t4'>9</text><text x='854' y='502' class='t5'>Articulate the real</text><text x='854' y='526' class='t5'>business project</text><rect x='60' y='616' width='344' height='110' class='r2' /><circle cx='90' cy='646' r='18' class='c1' /><text x='90' y='652' class='t4'>10</text><text x='118' y='649' class='t5'>Install Python 3.14 with uv</text><rect x='428' y='616' width='344' height='110' class='r2' /><circle cx='458' cy='646' r='18' class='c1' /><text x='458' y='652' class='t4'>11</text><text x='486' y='638' class='t5'>Create the integrated</text><text x='486' y='662' class='t5'>workspace</text><rect x='796' y='616' width='344' height='110' class='r2' /><circle cx='826' cy='646' r='18' class='c1' /><text x='826' y='652' class='t4'>12</text><text x='854' y='638' class='t5'>Build the first useful</text><text x='854' y='662' class='t5'>workflow</text><rect x='60' y='752' width='344' height='110' class='r2' /><circle cx='90' cy='782' r='18' class='c1' /><text x='90' y='788' class='t4'>13</text><text x='118' y='774' class='t5'>Adopt the daily engineering</text><text x='118' y='798' class='t5'>loop</text><line x1='408' y1='263' x2='420' y2='263' class='l1' /><polygon points='420.0,263.0 409.2,268.2 409.2,257.8' class='p1' /><line x1='776' y1='263' x2='788' y2='263' class='l1' /><polygon points='788.0,263.0 777.2,268.2 777.2,257.8' class='p1' /><line x1='408' y1='399' x2='420' y2='399' class='l1' /><polygon points='420.0,399.0 409.2,404.2 409.2,393.8' class='p1' /><line x1='776' y1='399' x2='788' y2='399' class='l1' /><polygon points='788.0,399.0 777.2,404.2 777.2,393.8' class='p1' /><line x1='408' y1='535' x2='420' y2='535' class='l1' /><polygon points='420.0,535.0 409.2,540.2 409.2,529.8' class='p1' /><line x1='776' y1='535' x2='788' y2='535' class='l1' /><polygon points='788.0,535.0 777.2,540.2 777.2,529.8' class='p1' /><line x1='408' y1='671' x2='420' y2='671' class='l1' /><polygon points='420.0,671.0 409.2,676.2 409.2,665.8' class='p1' /><line x1='776' y1='671' x2='788' y2='671' class='l1' /><polygon points='788.0,671.0 777.2,676.2 777.2,665.8' class='p1' /><text x='60' y='917' class='t3'>2. Two tracks run at once</text><text x='60' y='949' class='t6'>The workstation is being assembled while the developer’s existing mental model is translated into</text><text x='60' y='972' class='t6'>current terminology.</text><rect x='60' y='992' width='525' height='230' class='r2' /><text x='80' y='1026' class='t7'>Platform setup</text><text x='80' y='1056' class='t8'>GitHub identity → organization → repository →</text><text x='80' y='1079' class='t8'>Git / gh → VS Code → Python / uv</text><rect x='615' y='992' width='525' height='230' class='r2' /><text x='635' y='1026' class='t9'>Mental model</text><text x='635' y='1056' class='t8'>Local vs remote → repository vs workspace vs</text><text x='635' y='1079' class='t8'>codebase → tracked / staged / committed /</text><text x='635' y='1101.9' class='t8'>pushed → AI as collaborator → environment vs</text><text x='635' y='1124.8' class='t8'>dependencies → data flow and validation</text><text x='60' y='1277' class='t3'>3. Guiding loop for the LLM</text><rect x='60' y='1325' width='196.8' height='94' class='r3' /><circle cx='90' cy='1355' r='18' class='c2' /><text x='90' y='1361' class='t4'>1</text><text x='118' y='1358' class='t5'>Orient</text><rect x='280.8' y='1325' width='196.8' height='94' class='r3' /><circle cx='310.8' cy='1355' r='18' class='c2' /><text x='310.8' y='1361' class='t4'>2</text><text x='338.8' y='1358' class='t5'>Clarify</text><rect x='501.6' y='1325' width='196.8' height='94' class='r3' /><circle cx='531.6' cy='1355' r='18' class='c2' /><text x='531.6' y='1361' class='t4'>3</text><text x='559.6' y='1358' class='t5'>Inspect</text><rect x='722.4' y='1325' width='196.8' height='94' class='r3' /><circle cx='752.4' cy='1355' r='18' class='c2' /><text x='752.4' y='1361' class='t4'>4</text><text x='780.4' y='1358' class='t5'>Explain</text><rect x='943.2' y='1325' width='196.8' height='94' class='r3' /><circle cx='973.2' cy='1355' r='18' class='c2' /><text x='973.2' y='1361' class='t4'>5</text><text x='1001.2' y='1358' class='t5'>Act</text><rect x='60' y='1445' width='196.8' height='94' class='r3' /><circle cx='90' cy='1475' r='18' class='c2' /><text x='90' y='1481' class='t4'>6</text><text x='118' y='1478' class='t5'>Observe</text><rect x='280.8' y='1445' width='196.8' height='94' class='r3' /><circle cx='310.8' cy='1475' r='18' class='c2' /><text x='310.8' y='1481' class='t4'>7</text><text x='338.8' y='1478' class='t5'>Evaluate</text><rect x='501.6' y='1445' width='196.8' height='94' class='r3' /><circle cx='531.6' cy='1475' r='18' class='c2' /><text x='531.6' y='1481' class='t4'>8</text><text x='559.6' y='1478' class='t5'>Record</text><rect x='722.4' y='1445' width='196.8' height='94' class='r3' /><circle cx='752.4' cy='1475' r='18' class='c2' /><text x='752.4' y='1481' class='t4'>9</text><text x='780.4' y='1478' class='t5'>Gate</text><rect x='943.2' y='1445' width='196.8' height='94' class='r3' /><circle cx='973.2' cy='1475' r='18' class='c2' /><text x='973.2' y='1481' class='t4'>10</text><text x='1001.2' y='1478' class='t5'>Continue or pause</text><line x1='260.8' y1='1372' x2='272.8' y2='1372' class='l1' /><polygon points='272.8,1372.0 262.0,1377.2 262.0,1366.8' class='p1' /><line x1='481.6' y1='1372' x2='493.6' y2='1372' class='l1' /><polygon points='493.6,1372.0 482.8,1377.2 482.8,1366.8' class='p1' /><line x1='702.4' y1='1372' x2='714.4' y2='1372' class='l1' /><polygon points='714.4,1372.0 703.6,1377.2 703.6,1366.8' class='p1' /><line x1='923.2' y1='1372' x2='935.2' y2='1372' class='l1' /><polygon points='935.2,1372.0 924.4,1377.2 924.4,1366.8' class='p1' /><line x1='260.8' y1='1492' x2='272.8' y2='1492' class='l1' /><polygon points='272.8,1492.0 262.0,1497.2 262.0,1486.8' class='p1' /><line x1='481.6' y1='1492' x2='493.6' y2='1492' class='l1' /><polygon points='493.6,1492.0 482.8,1497.2 482.8,1486.8' class='p1' /><line x1='702.4' y1='1492' x2='714.4' y2='1492' class='l1' /><polygon points='714.4,1492.0 703.6,1497.2 703.6,1486.8' class='p1' /><line x1='923.2' y1='1492' x2='935.2' y2='1492' class='l1' /><polygon points='935.2,1492.0 924.4,1497.2 924.4,1486.8' class='p1' /><text x='60' y='1589' class='t3'>4. Completion standard</text><rect x='60' y='1637' width='344' height='106' class='r4' /><circle cx='90' cy='1667' r='18' class='c3' /><text x='90' y='1673' class='t4'>1</text><text x='118' y='1670' class='t5'>GitHub identity works</text><rect x='428' y='1637' width='344' height='106' class='r4' /><circle cx='458' cy='1667' r='18' class='c3' /><text x='458' y='1673' class='t4'>2</text><text x='486' y='1670' class='t5'>Organization exists</text><rect x='796' y='1637' width='344' height='106' class='r4' /><circle cx='826' cy='1667' r='18' class='c3' /><text x='826' y='1673' class='t4'>3</text><text x='854' y='1659' class='t5'>Repository exists and is</text><text x='854' y='1683' class='t5'>cloned</text><rect x='60' y='1769' width='344' height='106' class='r4' /><circle cx='90' cy='1799' r='18' class='c3' /><text x='90' y='1805' class='t4'>4</text><text x='118' y='1791' class='t5'>VS Code opens the correct</text><text x='118' y='1815' class='t5'>workspace</text><rect x='428' y='1769' width='344' height='106' class='r4' /><circle cx='458' cy='1799' r='18' class='c3' /><text x='458' y='1805' class='t4'>5</text><text x='486' y='1802' class='t5'>Copilot is active</text><rect x='796' y='1769' width='344' height='106' class='r4' /><circle cx='826' cy='1799' r='18' class='c3' /><text x='826' y='1805' class='t4'>6</text><text x='854' y='1802' class='t5'>Python 3.14 and uv work</text><rect x='60' y='1901' width='344' height='106' class='r4' /><circle cx='90' cy='1931' r='18' class='c3' /><text x='90' y='1937' class='t4'>7</text><text x='118' y='1923' class='t5'>The first integrated</text><text x='118' y='1947' class='t5'>project runs</text><rect x='428' y='1901' width='344' height='106' class='r4' /><circle cx='458' cy='1931' r='18' class='c3' /><text x='458' y='1937' class='t4'>8</text><text x='486' y='1923' class='t5'>Ruff, Pyright, and pytest</text><text x='486' y='1947' class='t5'>pass</text><rect x='796' y='1901' width='344' height='106' class='r4' /><circle cx='826' cy='1931' r='18' class='c3' /><text x='826' y='1937' class='t4'>9</text><text x='854' y='1923' class='t5'>The developer can reopen</text><text x='854' y='1947' class='t5'>tomorrow and continue</text><line x1='408' y1='1690' x2='420' y2='1690' class='l1' /><polygon points='420.0,1690.0 409.2,1695.2 409.2,1684.8' class='p1' /><line x1='776' y1='1690' x2='788' y2='1690' class='l1' /><polygon points='788.0,1690.0 777.2,1695.2 777.2,1684.8' class='p1' /><line x1='408' y1='1822' x2='420' y2='1822' class='l1' /><polygon points='420.0,1822.0 409.2,1827.2 409.2,1816.8' class='p1' /><line x1='776' y1='1822' x2='788' y2='1822' class='l1' /><polygon points='788.0,1822.0 777.2,1827.2 777.2,1816.8' class='p1' /><line x1='408' y1='1954' x2='420' y2='1954' class='l1' /><polygon points='420.0,1954.0 409.2,1959.2 409.2,1948.8' class='p1' /><line x1='776' y1='1954' x2='788' y2='1954' class='l1' /><polygon points='788.0,1954.0 777.2,1959.2 777.2,1948.8' class='p1' /></svg>