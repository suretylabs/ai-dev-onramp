<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1900' viewBox='0 0 1200 1900'><style>.r1{fill:#ffffff}.t1{font-family:Arial, Helvetica, sans-serif;font-size:42;font-weight:800;fill:#111827;text-anchor:start}.t2{font-family:Arial, Helvetica, sans-serif;font-size:18;font-weight:400;fill:#64748b;text-anchor:start}.t3{font-family:Arial, Helvetica, sans-serif;font-size:30;font-weight:750;fill:#111827;text-anchor:start}.r2{rx:16;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:#2563eb;stroke:none}.t4{font-family:Arial, Helvetica, sans-serif;font-size:16;font-weight:700;fill:#ffffff;text-anchor:middle}.t5{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:600;fill:#1f2937;text-anchor:start}.l1{stroke:#64748b;stroke-width:3;stroke-linecap:round}.p1{fill:#64748b}.r3{rx:16;fill:#f5f3ff;stroke:#cbd5e1;stroke-width:1.5}.c2{fill:#7c3aed;stroke:none}.t6{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#64748b;text-anchor:start}.r4{rx:16;fill:#ecfeff;stroke:#cbd5e1;stroke-width:1.5}.c3{fill:#0f766e;stroke:none}.t7{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#15803d;text-anchor:start}.t8{font-family:Arial, Helvetica, sans-serif;font-size:17;font-weight:400;fill:#1f2937;text-anchor:start}.t9{font-family:Arial, Helvetica, sans-serif;font-size:21;font-weight:700;fill:#dc2626;text-anchor:start}</style><rect width='100%' height='100%' class='r1' /><text x='60' y='72' class='t1'>AI Dev On-Ramp — VS Code and Copilot</text><text x='60' y='112' class='t2'>VS Code is the integrated workbench. Copilot belongs inside a repository that already contains</text><text x='60' y='136.3' class='t2'>durable context about the project and the operating rules.</text><text x='60' y='160' class='t3'>1. One folder, several roles</text><rect x='60' y='208' width='252' height='105' class='r2' /><circle cx='90' cy='238' r='18' class='c1' /><text x='90' y='244' class='t4'>1</text><text x='118' y='241' class='t5'>Windows folder</text><rect x='336' y='208' width='252' height='105' class='r2' /><circle cx='366' cy='238' r='18' class='c1' /><text x='366' y='244' class='t4'>2</text><text x='394' y='241' class='t5'>Git repository</text><rect x='612' y='208' width='252' height='105' class='r2' /><circle cx='642' cy='238' r='18' class='c1' /><text x='642' y='244' class='t4'>3</text><text x='670' y='241' class='t5'>VS Code workspace</text><rect x='888' y='208' width='252' height='105' class='r2' /><circle cx='918' cy='238' r='18' class='c1' /><text x='918' y='244' class='t4'>4</text><text x='946' y='241' class='t5'>Project codebase</text><line x1='316' y1='260.5' x2='328' y2='260.5' class='l1' /><polygon points='328.0,260.5 317.2,265.7 317.2,255.3' class='p1' /><line x1='592' y1='260.5' x2='604' y2='260.5' class='l1' /><polygon points='604.0,260.5 593.2,265.7 593.2,255.3' class='p1' /><line x1='868' y1='260.5' x2='880' y2='260.5' class='l1' /><polygon points='880.0,260.5 869.2,265.7 869.2,255.3' class='p1' /><text x='60' y='363' class='t3'>2. What VS Code brings together</text><rect x='60' y='411' width='344' height='100' class='r3' /><circle cx='90' cy='441' r='18' class='c2' /><text x='90' y='447' class='t4'>1</text><text x='118' y='444' class='t5'>Editor</text><rect x='428' y='411' width='344' height='100' class='r3' /><circle cx='458' cy='441' r='18' class='c2' /><text x='458' y='447' class='t4'>2</text><text x='486' y='444' class='t5'>Integrated terminal</text><rect x='796' y='411' width='344' height='100' class='r3' /><circle cx='826' cy='441' r='18' class='c2' /><text x='826' y='447' class='t4'>3</text><text x='854' y='444' class='t5'>Extensions</text><rect x='60' y='537' width='344' height='100' class='r3' /><circle cx='90' cy='567' r='18' class='c2' /><text x='90' y='573' class='t4'>4</text><text x='118' y='570' class='t5'>Source control view</text><rect x='428' y='537' width='344' height='100' class='r3' /><circle cx='458' cy='567' r='18' class='c2' /><text x='458' y='573' class='t4'>5</text><text x='486' y='570' class='t5'>Python tooling</text><rect x='796' y='537' width='344' height='100' class='r3' /><circle cx='826' cy='567' r='18' class='c2' /><text x='826' y='573' class='t4'>6</text><text x='854' y='570' class='t5'>Copilot</text><line x1='408' y1='461' x2='420' y2='461' class='l1' /><polygon points='420.0,461.0 409.2,466.2 409.2,455.8' class='p1' /><line x1='776' y1='461' x2='788' y2='461' class='l1' /><polygon points='788.0,461.0 777.2,466.2 777.2,455.8' class='p1' /><line x1='408' y1='587' x2='420' y2='587' class='l1' /><polygon points='420.0,587.0 409.2,592.2 409.2,581.8' class='p1' /><line x1='776' y1='587' x2='788' y2='587' class='l1' /><polygon points='788.0,587.0 777.2,592.2 777.2,581.8' class='p1' /><text x='60' y='687' class='t3'>3. Correct first use of Copilot</text><text x='60' y='719' class='t6'>The first Copilot session should establish shared understanding, not generate a random application</text><text x='60' y='742' class='t6'>scaffold.</text><rect x='60' y='762' width='344' height='110' class='r4' /><circle cx='90' cy='792' r='18' class='c3' /><text x='90' y='798' class='t4'>1</text><text x='118' y='795' class='t5'>Open the repository</text><rect x='428' y='762' width='344' height='110' class='r4' /><circle cx='458' cy='792' r='18' class='c3' /><text x='458' y='798' class='t4'>2</text><text x='486' y='784' class='t5'>Copilot reads bootstrap</text><text x='486' y='808' class='t5'>documents</text><rect x='796' y='762' width='344' height='110' class='r4' /><circle cx='826' cy='792' r='18' class='c3' /><text x='826' y='798' class='t4'>3</text><text x='854' y='784' class='t5'>Copilot restates its</text><text x='854' y='808' class='t5'>understanding</text><rect x='60' y='898' width='344' height='110' class='r4' /><circle cx='90' cy='928' r='18' class='c3' /><text x='90' y='934' class='t4'>4</text><text x='118' y='920' class='t5'>Developer corrects and adds</text><text x='118' y='944' class='t5'>context</text><rect x='428' y='898' width='344' height='110' class='r4' /><circle cx='458' cy='928' r='18' class='c3' /><text x='458' y='934' class='t4'>5</text><text x='486' y='920' class='t5'>Project brief becomes</text><text x='486' y='944' class='t5'>durable</text><rect x='796' y='898' width='344' height='110' class='r4' /><circle cx='826' cy='928' r='18' class='c3' /><text x='826' y='934' class='t4'>6</text><text x='854' y='920' class='t5'>Only then begin</text><text x='854' y='944' class='t5'>implementation</text><line x1='408' y1='817' x2='420' y2='817' class='l1' /><polygon points='420.0,817.0 409.2,822.2 409.2,811.8' class='p1' /><line x1='776' y1='817' x2='788' y2='817' class='l1' /><polygon points='788.0,817.0 777.2,822.2 777.2,811.8' class='p1' /><line x1='408' y1='953' x2='420' y2='953' class='l1' /><polygon points='420.0,953.0 409.2,958.2 409.2,947.8' class='p1' /><line x1='776' y1='953' x2='788' y2='953' class='l1' /><polygon points='788.0,953.0 777.2,958.2 777.2,947.8' class='p1' /><text x='60' y='1058' class='t3'>4. Copilot behavior</text><rect x='60' y='1106' width='525' height='230' class='r2' /><text x='80' y='1140' class='t7'>Copilot should</text><text x='80' y='1170' class='t8'>Ask clarifying questions</text><text x='80' y='1193' class='t8'>Explain unfamiliar tools</text><text x='80' y='1215.9' class='t8'>Inspect errors and evidence</text><text x='80' y='1238.8' class='t8'>Summarize legitimate next choices</text><text x='80' y='1261.8' class='t8'>Generate code after the project is understood</text><rect x='615' y='1106' width='525' height='230' class='r2' /><text x='635' y='1140' class='t9'>Copilot should not begin by</text><text x='635' y='1170' class='t8'>Scaffolding a random app</text><text x='635' y='1193' class='t8'>Assuming requirements</text><text x='635' y='1215.9' class='t8'>Overwriting structure without agreement</text><text x='635' y='1238.8' class='t8'>Presenting inference as documented fact</text><text x='60' y='1386' class='t3'>5. Durable context files</text><rect x='60' y='1434' width='528' height='110' class='r2' /><circle cx='90' cy='1464' r='18' class='c1' /><text x='90' y='1470' class='t4'>1</text><text x='118' y='1467' class='t5'>docs/PROJECT_BRIEF.md — what the project is</text><rect x='612' y='1434' width='528' height='110' class='r2' /><circle cx='642' cy='1464' r='18' class='c1' /><text x='642' y='1470' class='t4'>2</text><text x='670' y='1467' class='t5'>docs/BOOTSTRAP_STATE.md — where setup stands</text><rect x='60' y='1570' width='528' height='110' class='r2' /><circle cx='90' cy='1600' r='18' class='c1' /><text x='90' y='1606' class='t4'>3</text><text x='118' y='1592' class='t5'>.github/copilot-instructions.md — how the AI</text><text x='118' y='1616' class='t5'>should operate</text><rect x='612' y='1570' width='528' height='110' class='r2' /><circle cx='642' cy='1600' r='18' class='c1' /><text x='642' y='1606' class='t4'>4</text><text x='670' y='1603' class='t5'>README.md — how the repository is used</text><line x1='592' y1='1489' x2='604' y2='1489' class='l1' /><polygon points='604.0,1489.0 593.2,1494.2 593.2,1483.8' class='p1' /><line x1='592' y1='1625' x2='604' y2='1625' class='l1' /><polygon points='604.0,1625.0 593.2,1630.2 593.2,1619.8' class='p1' /></svg>